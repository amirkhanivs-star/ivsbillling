# ==============================================================================
# IQRA VIRTUAL SCHOOL — NGINX PRODUCTION VIRTUAL HOST CONFIGURATION
# ==============================================================================
# Place in: /etc/nginx/sites-available/iqra_billing
# Enable via: ln -s /etc/nginx/sites-available/iqra_billing /etc/nginx/sites-enabled/
# ==============================================================================

# 1. HTTP to HTTPS Redirection
server {
    listen 80;
    listen [::]:80;
    server_name billing.iqraschool.edu.sa; # Replace with production domain

    # ACME Challenge for Let's Encrypt Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name billing.iqraschool.edu.sa; # Replace with production domain

    # SSL Certificates (Managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/billing.iqraschool.edu.sa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/billing.iqraschool.edu.sa/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS (HTTP Strict Transport Security - 1 Year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Document Root — MUST strictly point to Laravel's public directory
    root /var/www/iqra-billing/public;
    index index.php;

    charset utf-8;
    client_max_body_size 20M;

    # Logging
    access_log /var/log/nginx/iqra_billing_access.log combined;
    error_log /var/log/nginx/iqra_billing_error.log warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # PHP-FPM Execution
    location ~ \.php$ {
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock; # Adjust if using php8.3
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120s;
        fastcgi_buffer_size 128k;
        fastcgi_buffers 4 256k;
        fastcgi_busy_buffers_size 256k;
    }

    # Deny access to hidden files (.env, .git, etc.)
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny direct access to sensitive file types
    location ~* \.(sql|bak|xlsx|csv|zip|gz|tar|json|lock)$ {
        deny all;
        access_log off;
        log_not_found off;
    }
}

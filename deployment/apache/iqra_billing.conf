# ==============================================================================
# IQRA VIRTUAL SCHOOL — APACHE PRODUCTION VIRTUAL HOST CONFIGURATION
# ==============================================================================
# Place in: /etc/apache2/sites-available/iqra_billing.conf
# Enable via: a2ensite iqra_billing.conf && a2enmod rewrite ssl headers proxy_fcgi
# ==============================================================================

<VirtualHost *:80>
    ServerName billing.iqraschool.edu.sa
    ServerAdmin admin@iqraschool.edu.sa

    # Redirect all HTTP traffic to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

    ErrorLog ${APACHE_LOG_DIR}/iqra_billing_error.log
    CustomLog ${APACHE_LOG_DIR}/iqra_billing_access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName billing.iqraschool.edu.sa
    ServerAdmin admin@iqraschool.edu.sa

    # Document Root MUST strictly point to Laravel's public directory
    DocumentRoot /var/www/iqra-billing/public

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/billing.iqraschool.edu.sa/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/billing.iqraschool.edu.sa/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5:!3DES

    # Security Headers
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"

    <Directory /var/www/iqra-billing/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Deny access to sensitive files
    <FilesMatch "^\.env|\.git|composer\.(json|lock)|\.sql$|\.xlsx$|\.csv$">
        Require all denied
    </FilesMatch>

    # PHP-FPM Handler
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/var/run/php/php8.2-fpm.sock|fcgi://localhost/"
    </FilesMatch>

    ErrorLog ${APACHE_LOG_DIR}/iqra_billing_ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/iqra_billing_ssl_access.log combined
</VirtualHost>

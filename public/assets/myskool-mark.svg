<title id="logo-title">IVS Billing Dashboard</title>
<desc id="logo-desc">A burgundy shield with a white invoice and gold coin, flanked by navy laurel branches and two gold stars, above the IVS wordmark and Billing Dashboard descriptor.</desc>

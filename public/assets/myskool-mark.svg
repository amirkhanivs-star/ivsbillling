  <linearGradient id="paperGrad" x1="0" x2="1" y1="0.4" y2="0.8"><stop stop-color="#fff"/><stop offset="0.62" stop-color="#fafbfe"/><stop offset="1" stop-color="#e5e8ee"/></linearGradient>
